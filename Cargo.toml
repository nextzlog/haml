[workspace]
members = ["lib", "ui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nextzlog/haml"

[workspace.dependencies]
haml = { path = "lib" }
egui = "0.37"
egui_kittest = "0.37"
eframe = { version = "0.37", features = ["persistence"] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
